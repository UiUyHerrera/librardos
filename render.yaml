databases:
  - name: reservini-db
    plan: free
    databaseName: reservini
    user: reservini

envVarGroups:
  - name: reservini-settings
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: FLASK_APP
        value: reservini
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SENDER
        sync: false

services:
  - type: web
    name: reservini
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pybabel compile -d reservini/translations && flask init-db
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT "reservini:create_app()"
    healthCheckPath: /
    envVars:
      - fromGroup: reservini-settings
      - key: DATABASE_URL
        fromDatabase:
          name: reservini-db
          property: connectionString

  - type: cron
    name: reservini-reminders
    runtime: python
    plan: starter
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt && pybabel compile -d reservini/translations
    startCommand: flask send-reminders
    envVars:
      - fromGroup: reservini-settings
      - key: DATABASE_URL
        fromDatabase:
          name: reservini-db
          property: connectionString
